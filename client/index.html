      <h1>Abhiara Foundation — Fearless Ray of Light</h1>
      <p>Abhiara Foundation is a Section 8 Not-for-Profit organization founded by <strong>Abhimanyu Mallik</strong> in Raisar, Kendrapara, Odisha, India.</p>
      <p>We focus on education for underprivileged children and dignity for the elderly. Built from the village up.</p>
      <h2>Our Mission</h2>
      <p>Every child from a remote village deserves a fearless path. Every elder deserves dignity in their final years. We are building that path — village by village, district by district, life by life.</p>
      <h2>What We Do</h2>
      <ul>
        <li><strong>Education:</strong> Digital learning centres, scholarship support for Class 8-12 students, and early childhood readiness programmes across Odisha and beyond.</li>
        <li><strong>Elderly Care:</strong> Companion networks, quarterly health camps, and legal aid support for pension and property rights.</li>
        <li><strong>CSR Implementation:</strong> End-to-end CSR project implementation for corporates under Companies Act Schedule VII.</li>
      </ul>
      <h2>The Founder</h2>
      <p><strong>Abhimanyu Mallik</strong> is the Founder of Abhiara Foundation. Born in Raisar, a small village in Kendrapara district, Odisha. His journey from a remote village to Mumbai inspired the creation of Abhiara Foundation — a promise that the next child from the village has a path.</p>
      <h2>The Name: ABHIARA</h2>
      <p>ABHI (Fearless, from Abhimanyu — the Founder) + ARA (Ray of Sacred Light, from Aradhana — the Founder's daughter) = A Fearless Ray of Light.</p>
      <h2>Contact</h2>
      <p>Website: <a href="https://abhiarafoundation.com">https://abhiarafoundation.com</a></p>
